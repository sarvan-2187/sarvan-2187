name: Refresh profile

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/**
      - assets/sarvan.png

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fails the job (and leaves data/ + assets/ untouched) on any API or validation error.
      - run: npm run fetch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CODEFORCES_KEY: ${{ secrets.CODEFORCES_KEY }}
          CODEFORCES_SECRET: ${{ secrets.CODEFORCES_SECRET }}

      - run: npm run build

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: refresh profile [skip ci]"
          git push
